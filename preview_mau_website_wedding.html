    * {

      padding: 0;

    ::-webkit-scrollbar {

    ::-webkit-scrollbar-track {

    }
    ::-webkit-scrollbar-thumb {

      background: var(--primary);

    body {

      color: var(--slate-800);
      line-height: 1.5;

    /* HEADER */
    header {

      border-bottom: 1px solid var(--border);

      top: 0;

    .header-container {

      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-title {

      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #be123c, #e11d48);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;

    .brand-title h1 {

      font-weight: 800;
      color: var(--slate-900);

    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      border: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--slate-100);
      color: var(--slate-700);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--slate-200);
      color: var(--slate-900);
    }

      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
    }

    .filter-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--slate-600);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      border-color: var(--slate-400);
      color: var(--slate-800);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(190, 18, 60, 0.2);

    .search-input {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 13px;
      width: 280px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);

    .stats-strip {

      margin: 20px auto 0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--slate-500);
    }

    /* GRID CONTAINER */
    .main-container {
      max-width: 1400px;
      margin: 16px auto 60px;
      padding: 0 24px;

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .website-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .website-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary-border);
    }

    /* BROWSER BAR MOCKUP */
    .card-browser-bar {
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e2e8f0;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

      margin-left: 8px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      font-size: 11px;
      color: var(--slate-500);
      padding: 2px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
    }
    .browser-url:hover {
      color: var(--primary);
    }

    .card-thumbnail-wrapper {
      position: relative;
      height: 240px;
      background: #0f172a;
      overflow: hidden;
      cursor: pointer;
    }

    .card-thumbnail {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 4s ease-out;
      transform: translateY(0);
    }

    .card-thumbnail-wrapper:hover .card-thumbnail {
      transform: translateY(-40%);
    }

    .hover-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;

    .card-thumbnail-wrapper:hover .hover-overlay {
      opacity: 1;
    }

      font-weight: 600;

      align-items: center;
      justify-content: center;
      gap: 4px;

      border: 1px solid var(--slate-900);

    .btn-view:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn-link {
      background: #ffffff;
      color: var(--slate-700);
      border: 1px solid var(--border);
    }
    .btn-link:hover {
      background: var(--slate-100);
      color: var(--slate-900);
    }

    /* LIGHTBOX MODAL */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      flex-direction: column;

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-header {

      background: rgba(15, 23, 42, 0.85);

      align-items: center;
      justify-content: space-between;

      align-items: center;
      gap: 16px;

      font-size: 13px;

      gap: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      z-index: 120;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);

    @media (max-width: 768px) {

        align-items: flex-start;
      }
      .filter-container {

        align-items: stretch;
      }
      .search-input {

      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }

    let currentFilter = 'all';
    let currentSearch = '';
    let currentLightboxIndex = 0;
    let filteredList = [...websites];

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      filteredList = websites.filter(item => {
        const matchesCategory = currentFilter === 'all' || item.tag === currentFilter;
        const matchesSearch = item.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
                              item.domain.toLowerCase().includes(currentSearch.toLowerCase()) ||
                              item.desc.toLowerCase().includes(currentSearch.toLowerCase()) ||
                              item.location.toLowerCase().includes(currentSearch.toLowerCase()) ||
                              item.vibe.toLowerCase().includes(currentSearch.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      document.getElementById('resultsCount').innerText = `Hiển thị ${filteredList.length}/${websites.length} website`;

      if (filteredList.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #64748b;">
          <p style="font-size: 16px; font-weight: 600;">Không tìm thấy website phù hợp</p>
          <p style="font-size: 13px; margin-top: 4px;">Vui lòng thử từ khóa tìm kiếm khác</p>
        </div>`;
        return;
      }

      filteredList.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'website-card';
        card.innerHTML = `
          <div class="card-browser-bar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <a href="${item.url}" target="_blank" class="browser-url" title="${item.url}">${item.url}</a>
          </div>
          <div class="card-thumbnail-wrapper" onclick="openLightbox(${index})">
            <img src="${item.image}" alt="${item.name}" class="card-thumbnail" loading="lazy">
            <div class="hover-overlay">
              <span class="zoom-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                Xem Toàn Màn Hình
              </span>
            </div>
            <span class="file-size-badge">${item.size}</span>
          </div>
          <div class="card-body">
            <div class="card-header-meta">
              <span class="category-badge">${item.category}</span>
              <span class="location-text">📍 ${item.location}</span>
            </div>
            <h3 class="website-name">${item.name}</h3>
            <p class="website-desc">${item.desc}</p>
            <div class="card-footer">
              <button class="card-btn btn-view" onclick="openLightbox(${index})">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                Xem ảnh Full-Page
              </button>
              <a href="${item.url}" target="_blank" class="card-btn btn-link">
                Truy cập Web ↗
              </a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat, el) {
      currentFilter = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      renderCards();
    }

    function filterSearch() {
      currentSearch = document.getElementById('searchInput').value;
      renderCards();
    }

    function openLightbox(index) {
      currentLightboxIndex = index;
      updateLightboxContent();
      document.getElementById('lightboxModal').classList.add('active');
      document.body.style.overflow = 'hidden';
      document.getElementById('lightboxBody').scrollTop = 0;
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function updateLightboxContent() {
      const item = filteredList[currentLightboxIndex];
      if (!item) return;
      document.getElementById('lightboxIndex').innerText = `${currentLightboxIndex + 1}/${filteredList.length}`;
      document.getElementById('lightboxTitle').innerText = `${item.name} (${item.category})`;
      document.getElementById('lightboxImg').src = item.image;
      document.getElementById('lightboxWebLink').href = item.url;
      document.getElementById('lightboxRawImgLink').href = item.image;
    }

    function nextImage() {
      if (currentLightboxIndex < filteredList.length - 1) {
        currentLightboxIndex++;
      } else {
        currentLightboxIndex = 0;
      }
      updateLightboxContent();
      document.getElementById('lightboxBody').scrollTop = 0;
    }

    function prevImage() {
      if (currentLightboxIndex > 0) {
        currentLightboxIndex--;
      } else {
        currentLightboxIndex = filteredList.length - 1;
      }
      updateLightboxContent();
      document.getElementById('lightboxBody').scrollTop = 0;
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightboxModal').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') nextImage();
      if (e.key === 'ArrowLeft') prevImage();
    });

    function copyAllLinks() {
      const text = websites.map(w => `${w.name} - ${w.url}`).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        showToast("Đã copy 20 liên kết vào clipboard!");
      }).catch(err => {
        showToast("Lỗi sao chép: " + err);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMessage');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Initial render
    renderCards();
  </script>
